version: '3.8'

services:
  # 1. Capa REST Ultrarrápida PostgREST para el Catálogo Público
  postgrest:
    image: postgrest/postgrest:v12.0.2
    container_name: studiobj-postgrest
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PGRST_DB_URI: "postgresql://dbmasteruser:pidemala@ls-b12cc9081f17b594187264e8c7fe42119a9bb93f.cgt2s428cp85.us-east-1.rds.amazonaws.com:5432/postgres?sslmode=require"
      PGRST_DB_SCHEMAS: "bdstudiobj"
      PGRST_DB_ANON_ROLE: "web_anon"
      PGRST_SERVER_PORT: "3001"
      PGRST_SERVER_HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/3001;echo -e 'GET / HTTP/1.1\\r\\nhost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3;cat <&3 | grep -q 'HTTP/1.1 200'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend FastAPI - Lógica de Negocio, Autenticación JWT y Admin RBAC
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studiobj-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. Frontend React + Vite + Tailwind CSS Dark Luxury
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studiobj-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
